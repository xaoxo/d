[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "immo-scanner"
version = "0.2.0"
description = "Scanner d'opportunités immobilières en France : rentabilité, biens sous-évalués, potentiel de plus-value (DVF + loyers + annonces)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Vérification TLS par le système (Windows/macOS) : complète les chaînes de certificats
    # incomplètes comme le fait le navigateur (ex. cessions.immobilier-etat.gouv.fr).
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
immo = "immo_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["immo_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

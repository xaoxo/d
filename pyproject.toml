[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "immo-scanner"
version = "0.1.0"
description = "Scanner d'opportunités immobilières en France : rentabilité, biens sous-évalués, potentiel de plus-value (DVF + loyers + annonces)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
immo = "immo_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["immo_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
